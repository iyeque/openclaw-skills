name: Validate skills

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate package structure and frontmatter
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          allowed = {'name', 'description', 'license', 'metadata', 'allowed-tools'}
          for skill in sorted(Path('skills').iterdir()):
              assert skill.is_dir(), skill
              skill_md = skill / 'SKILL.md'
              assert skill_md.exists(), f'{skill}: missing SKILL.md'
              text = skill_md.read_text()
              assert text.startswith('---\n') and '\n---\n' in text, f'{skill}: missing frontmatter'
              frontmatter = text.split('\n---\n', 1)[0][4:]
              keys = {line.split(':', 1)[0].strip() for line in frontmatter.splitlines() if ':' in line and not line.startswith(' ')}
              assert {'name', 'description'} <= keys, f'{skill}: missing required frontmatter'
              assert keys <= allowed, f'{skill}: unsupported frontmatter keys: {keys - allowed}'
              forbidden = {'.clawhub', '_meta.json', 'skill-card.md'}
              assert not any(p.name in forbidden for p in skill.rglob('*')), f'{skill}: registry metadata present'
              assert not any(p.suffix in {'.pyc', '.pyo', '.pyd'} for p in skill.rglob('*')), f'{skill}: generated bytecode present'
              print(f'{skill}: validation passed')
          PY
      - name: Syntax checks
        run: |
          python3 -m py_compile -q skills/audio-processing/tool.py skills/local-system-info/sysinfo.py skills/pdf-reader/reader.py skills/meeting-transcription/meeting.py
          node --check skills/unified-web-search/index.js
          node --check skills/device-control/ctl.js
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
