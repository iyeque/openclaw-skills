name: Feature request
description: Suggest a focused improvement or workflow.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: input
    id: skill
    attributes:
      label: Related skill
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: User outcome
      description: Describe the job a user is trying to complete and why the current behavior is insufficient.
    validations:
      required: true
