name: Bug report
description: Report a reproducible problem in a skill.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: skill
    attributes:
      label: Skill and version
      placeholder: "pdf-reader 1.2.1"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the command, sanitized input shape, and expected versus actual output.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and runtime
      placeholder: "Ubuntu 24.04, Python 3.11"
    validations:
      required: true
